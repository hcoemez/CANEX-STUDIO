# Lädt die Website nach jeder Änderung automatisch zu IONOS hoch.
# Benötigte GitHub-Secrets (Settings → Secrets and variables → Actions):
#   SFTP_USER      – SFTP-Benutzername aus dem IONOS-Hosting
#   SFTP_PASSWORD  – Passwort dieses SFTP-Benutzers
name: Website zu IONOS hochladen

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SFTP_HOST: access-5019872599.webspace-host.com
  REMOTE_DIR: /public

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v5

      - name: Website bauen (pages + partials + static → dist)
        run: python3 build.py

      - name: Schriften lokal einbinden (statt Google Fonts, DSGVO)
        run: |
          npm install --no-save --no-audit --no-fund --prefix /tmp/fonts \
            @fontsource-variable/raleway @fontsource-variable/playfair-display
          mkdir -p dist/assets/fonts
          for f in raleway/files/raleway-latin-wght-normal.woff2 \
                   raleway/files/raleway-latin-wght-italic.woff2 \
                   playfair-display/files/playfair-display-latin-wght-normal.woff2 \
                   playfair-display/files/playfair-display-latin-wght-italic.woff2; do
            cp "/tmp/fonts/node_modules/@fontsource-variable/$f" dist/assets/fonts/
          done
          ls -la dist/assets/fonts

      - name: SFTP-Programm installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Hochladen nach IONOS (/public)
        env:
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          if [ -z "$SFTP_USER" ] || [ -z "$SFTP_PASSWORD" ]; then
            echo "::error::Secrets SFTP_USER und SFTP_PASSWORD fehlen (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          CONNECT="set sftp:auto-confirm yes; set net:max-retries 3; set net:timeout 30; open -u \"$SFTP_USER\",\"$SFTP_PASSWORD\" sftp://$SFTP_HOST"

          # Ein SFTP-Benutzer, der auf /public beschränkt ist, startet direkt
          # in diesem Ordner. Ein Benutzer mit Zugriff auf den ganzen Webspace
          # sieht dagegen die Ordner "public" und "intern".
          LISTING=$(lftp -c "$CONNECT; cls -1 /")
          echo "Inhalt des SFTP-Startordners:"; echo "$LISTING"
          if echo "$LISTING" | grep -qx 'public/\?'; then
            TARGET="$REMOTE_DIR"
          else
            TARGET="/"
          fi
          echo "Ziel: $TARGET"

          lftp -c "$CONNECT; mirror --reverse --delete --verbose --exclude-glob .DS_Store dist/ $TARGET"
